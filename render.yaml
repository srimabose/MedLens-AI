services:
  # Unified Web Service (Backend + Frontend) - FREE TIER
  - type: web
    name: medlens-ai
    env: python
    plan: free
    region: oregon
    buildCommand: |
      # Install backend dependencies
      cd backend && pip install -r requirements.txt
      # Install frontend dependencies and build
      cd ../frontend && npm install && npm run build
      # Move frontend build to backend directory for serving
      cp -r dist ../backend/
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: medlens_ai
      - key: SECRET_KEY
        value: medlens-ai-secret-key-for-jwt-tokens-change-in-production-2024
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://medlens-ai.onrender.com